<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 0; width: 700px; background: var(--washi-100); }
  .header-bar {
    background: var(--background); border-bottom: 1px solid var(--border);
    height: 56px; display: flex; align-items: center; padding: 0 20px; gap: 28px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .mark {
    width: 24px; height: 24px; border-radius: 5px; background: var(--shu-500);
    color: #fff7f1; display: flex; align-items: center; justify-content: center;
    font: 700 14px var(--font-jp); line-height: 1;
  }
  .brand .word { font: 600 16px var(--font-sans); color: var(--washi-900); letter-spacing: -0.01em; }
  .nav { display: flex; gap: 24px; }
  .nav a { font: 400 13px var(--font-sans); color: var(--washi-500); text-decoration: none; transition: color var(--duration-fast) var(--ease-out); }
  .nav a:hover { color: var(--washi-800); }
  .nav a.active { color: var(--washi-900); font-weight: 500; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--washi-600); background: transparent; border: 0; cursor: pointer; position: relative;
  }
  .icon-btn:hover { background: var(--washi-200); color: var(--washi-800); }
  .dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 999px; background: var(--shu-500); border: 2px solid var(--background); }
  .avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--ai-500); color: #fff; display: inline-flex; align-items: center; justify-content: center; font: 600 12px var(--font-sans); }
  .footer-label { padding: 14px 20px 0; font: 500 11px var(--font-mono); color: var(--washi-500); }
</style></head>
<body>
  <div class="header-bar">
    <div class="brand">
      <div class="mark">日</div>
      <div class="word">Nihongo IT</div>
    </div>
    <nav class="nav">
      <a href="#" class="active">Từ vựng</a>
      <a href="#">Hội thoại</a>
      <a href="#">Flashcards</a>
      <a href="#">Thống kê</a>
    </nav>
    <div class="right">
      <button class="icon-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="dot"></span>
      </button>
      <div class="avatar">HV</div>
    </div>
  </div>
  <div class="footer-label">Header.tsx — sticky, 56px, solid background, single bottom border, shu notification dot</div>
</body></html>
