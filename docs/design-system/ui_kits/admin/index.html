<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Nihongo IT — Admin UI Kit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="kit.css">
  <link rel="stylesheet" href="admin.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ui-primitives.jsx"></script>
  <script type="text/babel" src="AdminShell.jsx"></script>
  <script type="text/babel" src="AdminDashboard.jsx"></script>
  <script type="text/babel" src="AdminVocabularyTable.jsx"></script>
  <script type="text/babel" src="AdminUsersTable.jsx"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    function PlaceholderScreen({ title, sub }) {
      return (
        <div>
          <div className="adm-page-head">
            <div>
              <h1 className="adm-h1">{title}</h1>
              <div className="sub">{sub}</div>
            </div>
          </div>
          <Card style={{ padding: 48, textAlign: 'center' }}>
            <div style={{ font: '500 14px var(--font-sans)', color: 'var(--washi-500)' }}>
              Màn hình này dùng chung pattern bảng + bộ lọc với <strong style={{ color: 'var(--washi-800)' }}>Từ vựng</strong> và <strong style={{ color: 'var(--washi-800)' }}>Người dùng</strong>.
            </div>
          </Card>
        </div>
      );
    }

    function AdminApp() {
      const [active, setActive] = React.useState('dashboard');
      const user = { name: 'Lê Quốc Bảo', email: 'bao.le@nihongo-it.vn', initials: 'LB' };

      return (
        <div className="adm-shell">
          <AdminSidebar active={active} onNavigate={setActive} user={user}/>
          <div className="adm-main-col">
            <AdminTopbar active={active}/>
            <main className="adm-main">
              {active === 'dashboard'      && <AdminDashboard/>}
              {active === 'users'          && <AdminUsersTable/>}
              {active === 'vocabulary'     && <AdminVocabularyTable/>}
              {active === 'categories'     && <PlaceholderScreen title="Danh mục"     sub="Quản lý danh mục từ vựng theo lĩnh vực"/>}
              {active === 'topics'         && <PlaceholderScreen title="Chủ đề"        sub="Gắn nhãn chủ đề chi tiết cho từng từ"/>}
              {active === 'conversations'  && <PlaceholderScreen title="Hội thoại"     sub="Quản lý kịch bản hội thoại cho luyện tập"/>}
              {active === 'statistics'     && <PlaceholderScreen title="Thống kê"      sub="Phân tích tổng quan và theo người dùng"/>}
            </main>
          </div>
        </div>
      );
    }

    requestAnimationFrame(() => {
      ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp/>);
    });
  </script>
</body>
</html>
