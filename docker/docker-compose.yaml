# Core stack — Postgres + backend services + frontends + python NLP.
# Observability (Prometheus, Loki, Tempo, Grafana, OTel Collector) lives in
# docker-compose.o11y.yml. Use both files together:
#   docker compose -f docker/docker-compose.yaml -f docker/docker-compose.o11y.yml up -d
# or set COMPOSE_FILE env var (see .env.example).

# YAML anchor: shared OpenTelemetry env vars for every BE service.
# Each service overrides OTEL_SERVICE_NAME below.
x-otel-env: &otel-env
  JAVA_TOOL_OPTIONS: "-javaagent:/opentelemetry-javaagent.jar"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_LOGS_EXPORTER: "otlp"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=nihongo-it"
  OTEL_INSTRUMENTATION_LOGBACK-MDC_ADD-BAGGAGE: "true"
  OTEL_INSTRUMENTATION_LOGBACK-APPENDER_EXPERIMENTAL_CAPTURE_MDC_ATTRIBUTES: "*"

services:
  postgres:
    image: postgres:16
    container_name: nihongoit-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on first container start (empty data dir) — creates per-service databases
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/postgres_init.sql:ro
    networks:
      - nihongo_network
    restart: no

  python:
    build:
      context: ../python
      dockerfile: Dockerfile
    image: nihongoit/python:latest
    container_name: nihongoit-python
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEBUG_MODE: "false"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      INTERNAL_ONLY: "true"
    ports:
      - "8000:8000"
    networks:
      - nihongo_network
    restart: no

  eureka-server:
    build:
      context: ../services
      dockerfile: eureka-server/Dockerfile
    image: nihongoit/eureka-server:latest
    container_name: nihongoit-eureka-server
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "eureka-server"
    volumes:
      - ./libs/opentelemetry-javaagent.jar:/opentelemetry-javaagent.jar:ro
    ports:
      - "8761:8761"
    networks:
      - nihongo_network
    restart: no

  api-gateway:
    build:
      context: ../services
      dockerfile: api-gateway/Dockerfile
    image: nihongoit/api-gateway:latest
    container_name: nihongoit-api-gateway
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "api-gateway"
      EUREKA_SERVICE_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./libs/opentelemetry-javaagent.jar:/opentelemetry-javaagent.jar:ro
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
    networks:
      - nihongo_network
    restart: no

  user-service:
    build:
      context: ../services
      dockerfile: user-service/Dockerfile
    image: nihongoit/user-service:latest
    container_name: nihongoit-user-service
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "user-service"
      DB_URL: jdbc:postgresql://postgres:5432/user_service
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVICE_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
    volumes:
      - ./libs/opentelemetry-javaagent.jar:/opentelemetry-javaagent.jar:ro
    ports:
      - "8086:8086"
    depends_on:
      - postgres
      - eureka-server
    networks:
      - nihongo_network
    restart: no

  ai-service:
    build:
      context: ../services
      dockerfile: ai-service/Dockerfile
    image: nihongoit/ai-service:latest
    container_name: nihongoit-ai-service
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "ai-service"
      EUREKA_SERVICE_URL: http://eureka-server:8761/eureka/
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL:-http://python:8000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    volumes:
      - ./libs/opentelemetry-javaagent.jar:/opentelemetry-javaagent.jar:ro
    ports:
      - "8087:8087"
    depends_on:
      - eureka-server
    networks:
      - nihongo_network
    restart: no

  notification-service:
    build:
      context: ../services
      dockerfile: notification/Dockerfile
    image: nihongoit/notification-service:latest
    container_name: nihongoit-notification-service
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "notification-service"
      DB_URL: jdbc:postgresql://postgres:5432/notification_service
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVICE_URL: http://eureka-server:8761/eureka/
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
    volumes:
      - ./libs/opentelemetry-javaagent.jar:/opentelemetry-javaagent.jar:ro
    ports:
      - "8089:8089"
    depends_on:
      - postgres
      - eureka-server
    networks:
      - nihongo_network
    restart: no

  learning-service:
    build:
      context: ../services
      dockerfile: learning-service/Dockerfile
    image: nihongoit/learning-service:latest
    container_name: nihongoit-learning-service
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: "learning-service"
      DB_URL: jdbc:postgresql://postgres:5432/learning_service
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EUREKA_SERVICE_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./libs/opentelemetry-javaagent.jar:/opentelemetry-javaagent.jar:ro
    ports:
      - "8088:8088"
    depends_on:
      - postgres
      - eureka-server
    networks:
      - nihongo_network
    restart: no

  # Next.js user app — primary user-facing frontend
  frontend-user:
    build:
      context: ../frontend-user
      dockerfile: Dockerfile
    image: nihongoit/frontend-user:latest
    container_name: nihongoit-frontend-user
    environment:
      # Browser-facing URL — must be reachable from the user's browser
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - nihongo_network
    restart: no

  # Next.js admin app — host port 3002 (grafana takes 3001 in the o11y stack)
  frontend-admin:
    build:
      context: ../frontend-admin
      dockerfile: Dockerfile
    image: nihongoit/frontend-admin:latest
    container_name: nihongoit-frontend-admin
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3002:3001"
    depends_on:
      - api-gateway
    networks:
      - nihongo_network
    restart: no

networks:
  nihongo_network:
    driver: bridge

volumes:
  postgres_data:
