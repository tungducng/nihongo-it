<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .row { gap: 0; }
  .swatch { border-radius: 0; height: 80px; border-right: 1px solid oklch(0 0 0 / 6%); }
  .swatch:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
  .swatch:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; border-right: 0; }
  .header { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .title { font: 600 14px var(--font-sans); color: var(--washi-800); }
  .meta { font: 500 11px var(--font-mono); color: var(--washi-500); }
</style></head>
<body>
  <div class="header">
    <div class="title">Shu-iro 朱色 — accent vermillion</div>
    <div class="meta">--shu-50 → --shu-900</div>
  </div>
  <div class="row">
    <div class="swatch light" style="background:var(--shu-50)"><span class="name">50</span></div>
    <div class="swatch light" style="background:var(--shu-100)"><span class="name">100</span></div>
    <div class="swatch light" style="background:var(--shu-200)"><span class="name">200</span></div>
    <div class="swatch" style="background:var(--shu-300)"><span class="name">300</span></div>
    <div class="swatch" style="background:var(--shu-400)"><span class="name">400</span></div>
    <div class="swatch" style="background:var(--shu-500); outline: 2px solid var(--shu-500); outline-offset:-2px;"><span class="name">500 ★</span></div>
    <div class="swatch" style="background:var(--shu-600)"><span class="name">600</span></div>
    <div class="swatch" style="background:var(--shu-700)"><span class="name">700</span></div>
    <div class="swatch" style="background:var(--shu-800)"><span class="name">800</span></div>
    <div class="swatch" style="background:var(--shu-900)"><span class="name">900</span></div>
  </div>
  <p style="margin-top: 12px; font: 400 12px/18px var(--font-sans); color: var(--washi-500);">Reserved for moments of emphasis — hanko brand mark, notification dots, "new" badges, streak indicators. Never a default button colour.</p>
</body></html>
