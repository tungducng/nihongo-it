<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; background: var(--washi-100); }
  .header { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .title { font: 600 14px var(--font-sans); color: var(--washi-800); }
  .meta { font: 500 11px var(--font-mono); color: var(--washi-500); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .vcard {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; transition: border-color var(--duration-base) var(--ease-out);
  }
  .vcard:hover { border-color: oklch(from var(--ai-500) l c h / 50%); }
  .head { display:flex; align-items:flex-start; justify-content: space-between; gap: 8px; }
  .term { font: 600 22px var(--font-jp); color: var(--washi-900); line-height: 1.1; }
  .pron { font: 400 13px var(--font-jp); color: var(--washi-500); margin-top: 4px; }
  .meaning { font: 400 13px/1.4 var(--font-sans); color: var(--washi-800); margin-top: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { margin-top: 14px; display: flex; gap: 6px; }
  .chip { display: inline-flex; height: 22px; padding: 0 9px; border-radius: 999px; font: 600 11px var(--font-sans); align-items: center; }
  .chip.n5 { background: oklch(from var(--jlpt-n5) l c h / 14%); color: oklch(from var(--jlpt-n5) calc(l - 0.2) c h); }
  .chip.n3 { background: oklch(from var(--jlpt-n3) l c h / 16%); color: oklch(from var(--jlpt-n3) calc(l - 0.24) c h); }
  .chip.n1 { background: oklch(from var(--jlpt-n1) l c h / 14%); color: oklch(from var(--jlpt-n1) calc(l - 0.16) c h); }
  .chip.out { background: transparent; color: var(--washi-700); border: 1px solid var(--border); }
  .bm { color: var(--washi-400); display: inline-flex; }
  .bm.saved { color: var(--ai-500); }
</style></head>
<body>
  <div class="header">
    <div class="title">Vocabulary card</div>
    <div class="meta">VocabularyCard.tsx — term + pronunciation + meaning + JLPT chip</div>
  </div>
  <div class="grid">
    <div class="vcard">
      <div class="head">
        <div>
          <div class="term">会議</div>
          <div class="pron">かいぎ</div>
        </div>
        <span class="bm saved"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span>
      </div>
      <div class="meaning">cuộc họp — buổi gặp mặt giữa nhiều người để thảo luận</div>
      <div class="chips"><span class="chip n3">N3</span><span class="chip out">Công sở</span></div>
    </div>
    <div class="vcard">
      <div class="head">
        <div>
          <div class="term">仕様書</div>
          <div class="pron">しようしょ</div>
        </div>
        <span class="bm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></span>
      </div>
      <div class="meaning">tài liệu đặc tả — mô tả chi tiết yêu cầu kỹ thuật của hệ thống</div>
      <div class="chips"><span class="chip n1">N1</span><span class="chip out">Lập trình</span></div>
    </div>
  </div>
</body></html>
