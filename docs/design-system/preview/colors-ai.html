<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .row { gap: 0; }
  .swatch { border-radius: 0; height: 80px; border-right: 1px solid oklch(0 0 0 / 6%); }
  .swatch:first-child { border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
  .swatch:last-child { border-top-right-radius: 10px; border-bottom-right-radius: 10px; border-right: 0; }
  .header { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .title { font: 600 14px var(--font-sans); color: var(--washi-800); }
  .meta { font: 500 11px var(--font-mono); color: var(--washi-500); }
</style></head>
<body>
  <div class="header">
    <div class="title">Ai-iro 藍色 — primary brand indigo</div>
    <div class="meta">--ai-50 → --ai-900</div>
  </div>
  <div class="row">
    <div class="swatch light" style="background:var(--ai-50)"><span class="name">50</span></div>
    <div class="swatch light" style="background:var(--ai-100)"><span class="name">100</span></div>
    <div class="swatch light" style="background:var(--ai-200)"><span class="name">200</span></div>
    <div class="swatch" style="background:var(--ai-300)"><span class="name">300</span></div>
    <div class="swatch" style="background:var(--ai-400)"><span class="name">400</span></div>
    <div class="swatch" style="background:var(--ai-500); outline: 2px solid var(--ai-500); outline-offset:-2px;"><span class="name">500 ★</span></div>
    <div class="swatch" style="background:var(--ai-600)"><span class="name">600</span></div>
    <div class="swatch" style="background:var(--ai-700)"><span class="name">700</span></div>
    <div class="swatch" style="background:var(--ai-800)"><span class="name">800</span></div>
    <div class="swatch" style="background:var(--ai-900)"><span class="name">900</span></div>
  </div>
  <p style="margin-top: 12px; font: 400 12px/18px var(--font-sans); color: var(--washi-500);">Primary buttons, links, active nav, focus rings, admin sidebar accents. <strong style="color:var(--washi-800)">--ai-500</strong> is the canonical brand value.</p>
</body></html>
