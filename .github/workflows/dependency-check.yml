name: OWASP Dependency-Check

# NVD scanning is slow (~10 min first run, caches afterwards). Run weekly + on
# demand instead of every push. Dependabot still handles per-PR vulnerability
# alerts; this workflow gives a per-service SARIF report uploaded to the
# Security tab.
on:
  schedule:
    - cron: '0 4 * * 1' # Mondays at 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-check.yml'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan-backend:
    name: Scan ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - learning-service
          - notification-service
          - ai-service
          - api-gateway
          - common

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('services/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache NVD database
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-dep-check-nvd-v1
          restore-keys: |
            ${{ runner.os }}-dep-check-nvd-

      - name: Resolve dependencies (so the JAR list is correct)
        run: ./gradlew :${{ matrix.service }}:dependencies --configuration runtimeClasspath
        working-directory: services

      - name: Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: nihongo-it-${{ matrix.service }}
          path: services/${{ matrix.service }}
          format: 'SARIF'
          # CVSS 7.0+ fails the job (HIGH/CRITICAL).
          args: >
            --failOnCVSS 7
            --enableRetired
            --suppression .github/dependency-check-suppressions.xml
        env:
          # Optional: set NVD_API_KEY secret to skip rate-limited public feed (faster).
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check-${{ matrix.service }}

      - name: Upload HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dep-check-${{ matrix.service }}
          path: reports/
          retention-days: 14
