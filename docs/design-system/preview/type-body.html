<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .header { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .title { font: 600 14px var(--font-sans); color: var(--washi-800); }
  .meta { font: 500 11px var(--font-mono); color: var(--washi-500); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 12px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.tok { font: 500 11px var(--font-mono); color: var(--washi-500); width: 100px; }
  td.spec { color: var(--washi-800); }
  .eyebrow { font: 600 11px/1 var(--font-sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--washi-500); }
  .body { font: 400 16px/24px var(--font-sans); color: var(--washi-800); }
  .body-sm { font: 400 14px/20px var(--font-sans); color: var(--washi-800); }
  .caption { font: 400 12px/16px var(--font-sans); color: var(--washi-500); }
</style></head>
<body>
  <div class="header">
    <div class="title">Body & supporting text</div>
    <div class="meta">eyebrow · body · body-sm · caption</div>
  </div>
  <table>
    <tr><td class="tok">.eyebrow</td><td class="spec"><span class="eyebrow">Tổng quan</span></td></tr>
    <tr><td class="tok">.body</td><td class="spec body">Khám phá từ vựng IT theo cấp độ JLPT — bookmark từng từ và luyện tập lại với flashcards.</td></tr>
    <tr><td class="tok">.body-sm</td><td class="spec body-sm">12 bài hội thoại · Luyện phát âm theo các bài hội thoại tiếng Nhật.</td></tr>
    <tr><td class="tok">.caption</td><td class="spec caption">Tìm kiếm tạm khoá khi đang lọc theo JLPT.</td></tr>
  </table>
</body></html>
