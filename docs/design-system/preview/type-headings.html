<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .header { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .title { font: 600 14px var(--font-sans); color: var(--washi-800); }
  .meta { font: 500 11px var(--font-mono); color: var(--washi-500); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 10px 0; border-bottom: 1px solid var(--border); vertical-align: baseline; }
  td.tok { font: 500 11px var(--font-mono); color: var(--washi-500); width: 70px; }
  td.size { font: 500 11px var(--font-mono); color: var(--washi-500); width: 90px; text-align: right; padding-right: 14px; }
  td.spec { color: var(--washi-800); letter-spacing: -0.015em; }
</style></head>
<body>
  <div class="header">
    <div class="title">Display & heading scale</div>
    <div class="meta">--text-xl → --text-5xl · Inter</div>
  </div>
  <table>
    <tr><td class="tok">h1</td><td class="size">36 / 700</td><td class="spec" style="font: 700 36px/44px var(--font-sans); letter-spacing:-0.02em;">Học tiếng Nhật chuyên ngành IT</td></tr>
    <tr><td class="tok">h2</td><td class="size">30 / 700</td><td class="spec" style="font: 700 30px/38px var(--font-sans); letter-spacing:-0.015em;">Từ vựng theo cấp độ JLPT</td></tr>
    <tr><td class="tok">h3</td><td class="size">24 / 600</td><td class="spec" style="font: 600 24px/32px var(--font-sans); letter-spacing:-0.01em;">Hội thoại</td></tr>
    <tr><td class="tok">h4</td><td class="size">20 / 600</td><td class="spec" style="font: 600 20px/28px var(--font-sans);">Thẻ ghi nhớ</td></tr>
    <tr><td class="tok">h5</td><td class="size">18 / 600</td><td class="spec" style="font: 600 18px/28px var(--font-sans);">Cài đặt tài khoản</td></tr>
  </table>
</body></html>
