<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .header { display:flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .title { font: 600 14px var(--font-sans); color: var(--washi-800); }
  .meta { font: 500 11px var(--font-mono); color: var(--washi-500); }
  .row-spec { display: grid; grid-template-columns: 60px 80px 1fr; gap: 12px; align-items: center; padding: 6px 0; }
  .name { font: 500 11px var(--font-mono); color: var(--washi-700); }
  .val { font: 400 11px var(--font-mono); color: var(--washi-500); text-align: right; }
  .bar { height: 14px; background: var(--ai-500); border-radius: 3px; }
</style></head>
<body>
  <div class="header">
    <div class="title">Spacing scale — 4px base</div>
    <div class="meta">--space-1 → --space-20</div>
  </div>
  <div class="row-spec"><div class="name">--space-1</div><div class="val">4px</div><div><div class="bar" style="width:4px"></div></div></div>
  <div class="row-spec"><div class="name">--space-2</div><div class="val">8px</div><div><div class="bar" style="width:8px"></div></div></div>
  <div class="row-spec"><div class="name">--space-3</div><div class="val">12px</div><div><div class="bar" style="width:12px"></div></div></div>
  <div class="row-spec"><div class="name">--space-4</div><div class="val">16px</div><div><div class="bar" style="width:16px"></div></div></div>
  <div class="row-spec"><div class="name">--space-5</div><div class="val">20px</div><div><div class="bar" style="width:20px"></div></div></div>
  <div class="row-spec"><div class="name">--space-6</div><div class="val">24px</div><div><div class="bar" style="width:24px"></div></div></div>
  <div class="row-spec"><div class="name">--space-8</div><div class="val">32px</div><div><div class="bar" style="width:32px"></div></div></div>
  <div class="row-spec"><div class="name">--space-10</div><div class="val">40px</div><div><div class="bar" style="width:40px"></div></div></div>
  <div class="row-spec"><div class="name">--space-12</div><div class="val">48px</div><div><div class="bar" style="width:48px"></div></div></div>
  <div class="row-spec"><div class="name">--space-16</div><div class="val">64px</div><div><div class="bar" style="width:64px"></div></div></div>
  <div class="row-spec"><div class="name">--space-20</div><div class="val">80px</div><div><div class="bar" style="width:80px"></div></div></div>
</body></html>
